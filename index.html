<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#152B2A" />
    <meta name="description" content="Water rate study analysis for Choctaw Nation public water systems — budgets, financial scorecard, 5-year projections, and board-ready reports." />
    <!-- Inline SVG favicon: brand water drop; no extra request, works in the single-file build and fixes the /favicon.ico 404. -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 2C16 2 6 14.5 6 21a10 10 0 0 0 20 0C26 14.5 16 2 16 2Z' fill='%231E3D3B'/%3E%3Cpath d='M16 5.8C16 5.8 8.5 15.6 8.5 21a7.5 7.5 0 0 0 15 0C23.5 15.6 16 5.8 16 5.8Z' fill='%2376B900'/%3E%3C/svg%3E" />
    <title>Water Rate Study Tool — Choctaw Nation OWRM</title>
  </head>
  <body>
    <div id="root">
      <!-- Shown until the app starts (React replaces it). If the app can't
           start, the guard below swaps in an explanation instead of leaving
           a blank page. Inline styles: this must work even if nothing else
           on the page does. -->
      <div id="wrs-boot" style="margin:auto;max-width:560px;padding:32px 24px;font-family:'Segoe UI',system-ui,-apple-system,sans-serif;color:#1e3d3b;text-align:center">
        <div style="font-size:15px;font-weight:600">Loading the Water Rate Study Tool…</div>
        <noscript>
          <p style="font-size:14px;line-height:1.6;color:#334155">This tool needs JavaScript. Turn JavaScript on for this page, or open the file in Chrome or Edge.</p>
        </noscript>
      </div>
    </div>
    <script>
      // Startup guard. Runs before the app; if the app can't start — an error
      // while loading, a script the browser refused, or a file that was cut
      // short in transfer — it says so on the page instead of leaving it
      // blank. Once the app has rendered (.wrs-app exists) it stays silent;
      // later errors are the app's own ErrorBoundary's job.
      (function () {
        var shown = false;
        function show(detail) {
          if (shown || document.querySelector('.wrs-app')) return;
          var box = document.getElementById('wrs-boot');
          if (!box) return;
          shown = true;
          box.style.textAlign = 'left';
          box.innerHTML =
            '<div style="font-size:18px;font-weight:700;margin-bottom:8px">The Water Rate Study Tool couldn’t start</div>' +
            '<p style="font-size:14px;line-height:1.6;color:#334155;margin:0 0 10px">Try these in order:</p>' +
            '<ol style="font-size:14px;line-height:1.7;color:#334155;margin:0 0 14px;padding-left:20px">' +
            '<li>Download the file again — an interrupted download is the most common cause. Open the new copy, not the old one.</li>' +
            '<li>Save it to your computer first, then open it with Chrome or Edge (right-click → Open with). A preview window inside another app won’t run it.</li>' +
            '<li>Update your browser if it is out of date.</li>' +
            '</ol>' +
            '<p style="font-size:12px;color:#64748b;margin:0 0 4px">If it still won’t start, send this to whoever gave you the file:</p>' +
            '<pre style="white-space:pre-wrap;font-size:12px;background:#f1f5f9;border:1px solid #cbd5e1;border-radius:8px;padding:10px;color:#0f172a;margin:0"></pre>';
          box.querySelector('pre').textContent = detail + '\n\nBrowser: ' + navigator.userAgent + '\nPage: ' + location.protocol;
        }
        window.addEventListener('error', function (e) {
          show('Error: ' + (e.message || 'a script failed to load') + (e.lineno ? ' (line ' + e.lineno + ')' : ''));
        });
        window.addEventListener('unhandledrejection', function (e) {
          var r = e.reason;
          show('Error: ' + ((r && r.message) || String(r)));
        });
        window.addEventListener('load', function () {
          setTimeout(function () {
            show('The page loaded but the app never started. The file may be incomplete.');
          }, 5000);
        });
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
