name: Branch cleanup

# Keeps the repository free of stray branches.
#
# - When a pull request from this repository is merged, its branch is deleted.
# - "Run workflow" (manual) sweeps branches: leave the input blank to delete
#   every branch already fully merged into the default branch, or list branch
#   names (space-separated) to delete specific ones, e.g. superseded work.
#
# The default branch is never deleted.

on:
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      branches:
        description: 'Space-separated branch names to delete (blank = every branch already merged into the default branch)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  delete-merged-head:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Delete the merged branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          DEFAULT: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$BRANCH" = "$DEFAULT" ]; then echo "Not deleting the default branch."; exit 0; fi
          gh api -X DELETE "repos/$REPO/git/refs/heads/$BRANCH" && echo "Deleted $BRANCH" || echo "$BRANCH was already gone"

  sweep:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Delete branches
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DEFAULT: ${{ github.event.repository.default_branch }}
          INPUT: ${{ inputs.branches }}
        run: |
          set -euo pipefail
          git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*'
          if [ -n "$INPUT" ]; then
            targets="$INPUT"
          else
            targets=""
            for ref in $(git for-each-ref --format='%(refname:lstrip=3)' refs/remotes/origin); do
              [ "$ref" = "HEAD" ] || [ "$ref" = "$DEFAULT" ] && continue
              if git merge-base --is-ancestor "origin/$ref" "origin/$DEFAULT"; then targets="$targets $ref"; fi
            done
          fi
          if [ -z "${targets// /}" ]; then echo "No branches to delete."; exit 0; fi
          for b in $targets; do
            if [ "$b" = "$DEFAULT" ]; then echo "Skipping the default branch."; continue; fi
            if gh api -X DELETE "repos/$REPO/git/refs/heads/$b" >/dev/null; then echo "Deleted $b"; else echo "Could not delete $b"; fi
          done
          echo "Remaining branches:"
          gh api "repos/$REPO/branches" --paginate --jq '.[].name'
